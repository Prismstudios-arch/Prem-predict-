[project]
name = "premmodel"
version = "0.1.0"
description = "Model worker: ingest, fit, predict, settle. See ../CLAUDE.md §3, §4, §5."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
    # libpg_query bindings — parses migrations with the real PostgreSQL
    # grammar, so SQL syntax errors are caught on Windows with no database
    # rather than when applying to the live project.
    "pglast>=7.0",
]

[project.scripts]
premmodel = "premmodel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/premmodel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
